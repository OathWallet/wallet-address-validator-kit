name: Release

on:
  push:
    tags:
      - "0.*"
      - "1.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: examples/run-examples.sh
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          files: wallet-address-validator-kit-*.tgz
          generate_release_notes: true
